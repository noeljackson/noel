[workspace]
members = [
    "crates/noel-agent",
    "crates/noel-ai",
    "crates/noel-chord",
    "crates/noel-cli",
    "crates/noel-config",
    "crates/noel-core",
    "crates/noel-env",
    "crates/noel-parity",
    "crates/noel-providers",
    "crates/noel-session",
    "crates/noel-tools",
    "crates/noel-tui",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.98"
async-trait = "0.1.92"
base64 = "0.22.1"
clap = { version = "4.5.38", features = ["derive"] }
crossterm = "0.29.0"
getrandom = "0.2.17"
image = { version = "0.25.9", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
ratatui = { version = "0.30.0", features = ["scrolling-regions"] }
reqwest = { version = "0.12.15", default-features = false, features = ["json", "stream"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
thiserror = "2.0.12"
time = { version = "0.3.47", features = ["formatting"] }
tokio = { version = "1.45.0", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
# noel-tools starts tool subprocesses in their own sessions (setsid) and kills
# their process groups on timeout, interrupt, or a fatal signal to noel.
nix = { version = "0.29", default-features = false, features = ["process", "signal"] }
