[workspace]
exclude = ["apps"]
members = [
    "crates/noel-agent",
    "crates/noel-ai",
    "crates/noel-chord",
    "crates/noel-cli",
    "crates/noel-client",
    "crates/noel-markdown",
    "crates/noel-codemode",
    "crates/noel-config",
    "crates/noel-core",
    "crates/noel-env",
    "crates/noel-ffi",
    "crates/noel-env-daemon",
    "crates/noel-parity",
    "crates/noel-plugin",
    "crates/noel-providers",
    "crates/noel-session",
    "crates/noel-tools",
    "crates/noel-tui",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"

# The lint policy every crate takes (`[lints] workspace = true`), for
# clippy run by hand and in editors too; `make lint` and CI also deny
# every warning.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std", "ansi"] }
anyhow = "1.0.98"
async-trait = "0.1.92"
base64 = "0.22.1"
clap = { version = "4.5.38", features = ["derive"] }
crossterm = "0.29.0"
getrandom = "0.4.2"
image = { version = "0.25.9", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
ratatui = { version = "0.30.2", features = ["scrolling-regions"] }
reqwest = { version = "0.12.15", default-features = false, features = ["json", "stream"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.11.0"
# bun runtime download (noel bun install): the GitHub release asset is a
# plain deflate zip holding one binary.
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
thiserror = "2.0.12"
time = { version = "0.3.47", features = ["formatting"] }
tokio = { version = "1.53.3", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
# noel-tools starts tool subprocesses in their own sessions (setsid) and kills
# their process groups on timeout, interrupt, or a fatal signal to noel.
nix = { version = "0.29", default-features = false, features = ["process", "signal"] }

# noel-env serve is uploaded to remote machines, so `make env-daemon` builds it
# small, as upstream builds pi-env; the other binaries keep the release profile.
[profile.env-daemon]
inherits = "release"
lto = true
codegen-units = 1
strip = true
