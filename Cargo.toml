[workspace]
members = [
    "crates/pi-agent",
    "crates/pi-ai",
    "crates/pi-cli",
    "crates/pi-config",
    "crates/pi-core",
    "crates/pi-parity",
    "crates/pi-providers",
    "crates/pi-session",
    "crates/pi-tools",
    "crates/pi-tui",
]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.98"
async-trait = "0.1.83"
base64 = "0.22.1"
clap = { version = "4.5.38", features = ["derive"] }
crossterm = "0.29.0"
image = { version = "0.25.9", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
ratatui = "0.30.0"
reqwest = { version = "0.12.15", default-features = false, features = ["json", "stream"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
time = { version = "0.3.47", features = ["formatting"] }
tokio = { version = "1.45.0", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
