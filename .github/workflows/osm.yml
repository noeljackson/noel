name: OSM malware enrichment

on:
  push:
    branches: [main]
  schedule:
    - cron: "43 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: osm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Refresh OSM intelligence and scan
        uses: noeljackson/supplychain@90f493b3f3ba4893abd2fda35bad09d49962229d
        env:
          SUPPLYCHAIN_OSM_TOKEN: ${{ secrets.OSM_TOKEN }}
        with:
          policy: strict
          source-policy: .supplychain/source-policy.json
          refresh-osm: true
