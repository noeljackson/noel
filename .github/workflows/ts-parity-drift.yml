name: TS Parity Drift

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      ts_reference_repo:
        description: 'TypeScript reference repository'
        required: false
        default: 'https://github.com/earendil-works/pi.git'
      ts_reference_ref:
        description: 'TypeScript reference ref to track'
        required: false
        default: 'main'

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: ts-parity-drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    env:
      TS_REFERENCE_REPO: ${{ inputs.ts_reference_repo || 'https://github.com/earendil-works/pi.git' }}
      TS_PARITY_TRACKING_REF: ${{ inputs.ts_reference_ref || 'main' }}
      DRIFT_BRANCH: parity/drift
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Check TypeScript parity drift
        id: parity
        continue-on-error: true
        run: make ts-parity-agent

      - name: Classify the result
        id: result
        if: steps.parity.outcome == 'failure'
        run: |
          if [ -s target/ts-parity-drift/fixture.diff ]; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
          else
            echo "drift=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload drift brief
        if: steps.parity.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ts-parity-drift
          path: target/ts-parity-drift

      # One open pull request carries the regenerated fixtures, so drift is a
      # reviewable diff whose CI run shows which Rust parity tests it breaks.
      # Fixes pushed to the branch are kept: new drift lands as a commit on top,
      # and nothing is committed or re-run when the fixtures did not change.
      - name: Open or update the drift pull request
        if: steps.result.outputs.drift == 'true'
        run: |
          set -euo pipefail
          sha="$(cat target/ts-parity-drift/reference-sha)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$DRIFT_BRANCH" > /dev/null; then
            git fetch --no-tags origin "$DRIFT_BRANCH"
            git switch -C "$DRIFT_BRANCH" "origin/$DRIFT_BRANCH"
          else
            git switch -C "$DRIFT_BRANCH"
          fi
          # Mirror the regenerated set, so fixtures upstream dropped are removed too.
          rm -f tests/fixtures/ts-parity/*.json
          cp target/ts-parity-drift/fixtures/*.json tests/fixtures/ts-parity/
          git add -A tests/fixtures/ts-parity
          changed=false
          if ! git diff --cached --quiet; then
            git commit -m "parity: refresh fixtures from upstream ${TS_PARITY_TRACKING_REF} at ${sha:0:12}"
            git push origin "$DRIFT_BRANCH"
            changed=true
          fi
          title="Parity drift: upstream ${TS_PARITY_TRACKING_REF} at ${sha:0:12}"
          head -c 60000 target/ts-parity-drift/brief.md > target/ts-parity-drift/pr-body.md
          pr="$(gh pr list --head "$DRIFT_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "$title" --body-file target/ts-parity-drift/pr-body.md
          else
            gh pr create --draft --base main --head "$DRIFT_BRANCH" \
              --title "$title" --body-file target/ts-parity-drift/pr-body.md
          fi
          if [ "$changed" = true ]; then
            gh workflow run ci.yml --ref "$DRIFT_BRANCH"
          fi

      - name: Fail when the harness itself failed
        if: steps.parity.outcome == 'failure' && steps.result.outputs.drift != 'true'
        run: exit 1
