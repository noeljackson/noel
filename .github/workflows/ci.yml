name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The parity drift job dispatches CI on its bot branch: pull requests opened
  # with GITHUB_TOKEN do not trigger pull_request workflows.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Format
        run: make fmt

      - name: Clippy
        run: make lint

      - name: Test
        run: make test

      - name: TTY e2e
        run: make e2e

  deny:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      # Licenses, bans and sources must pass (deny.toml, #180).
      - name: Licenses, bans, sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses bans sources

      # Advisories are reported without failing the build: a new advisory
      # appears here first, before it is fixed or noted in deny.toml.
      - name: Advisories
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        continue-on-error: true
        with:
          command: check advisories
