name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The parity drift job dispatches CI on its bot branch: pull requests opened
  # with GITHUB_TOKEN do not trigger pull_request workflows.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Format
        run: make fmt

      - name: Clippy
        run: make lint

      - name: Test
        run: make test

      - name: TTY e2e
        run: make e2e

  deny:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Licenses, bans and sources must pass (deny.toml, #180).
      - name: Licenses, bans, sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

      # Advisories are reported without failing the build: a new advisory
      # appears here first, before it is fixed or noted in deny.toml.
      - name: Advisories
        uses: EmbarkStudios/cargo-deny-action@v2
        continue-on-error: true
        with:
          command: check advisories
