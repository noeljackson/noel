[package]
name = "noel-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A client of noel server over Chord: its contracts, a connection that reconnects through any transport, and following a session's view. No processes, Unix sockets or terminal, so it builds for iOS."

[dependencies]
anyhow.workspace = true
getrandom.workspace = true
noel-chord = { path = "../noel-chord" }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "io-util"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
