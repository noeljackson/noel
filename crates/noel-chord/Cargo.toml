[package]
name = "noel-chord"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Chord link protocol 2 for noel: frames, links (memory, WebSocket, NDJSON), hosts with relay and principals, delta ops and their wire codec, canonical JSON, hash64 and contract descriptions"

[dependencies]
base64.workspace = true
flate2 = "=1.1.9"
futures-util = { version = "=0.3.32", default-features = false, features = ["sink", "std"] }
tokio = { workspace = true, features = ["rt", "sync", "time", "io-util"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
regex = "=1.12.3"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
libc = "=0.2.186"
tokio = { workspace = true, features = ["net", "rt-multi-thread", "macros", "test-util"] }
