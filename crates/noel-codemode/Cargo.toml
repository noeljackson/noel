[package]
name = "noel-codemode"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Upstream pi's codemode on the djs engine: model-written JavaScript or TypeScript that calls tools, run in a sandboxed VM with fuel, memory and output limits."

[dependencies]
# The djs engine (earendil-works/djs), pinned by commit: a `no_std` Rust
# JavaScript/TypeScript interpreter with fuel, memory limits and no JIT, so it
# also runs on iOS. djs-prelude's build script makes the base snapshot.
djs-core = { git = "https://github.com/earendil-works/djs", rev = "16b7438f433890dae1589eeaee972afbee073104", default-features = false, features = ["full", "unicode"] }
djs-prelude = { git = "https://github.com/earendil-works/djs", rev = "16b7438f433890dae1589eeaee972afbee073104", default-features = false, features = ["raw", "full", "unicode"] }
serde_json.workspace = true
thiserror.workspace = true
