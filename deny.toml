# cargo deny check (CI's `deny` job, #180): known advisories, licenses,
# duplicate versions and where crates come from.

[graph]
all-features = true

[advisories]
version = 2

[licenses]
version = 2
confidence-threshold = 0.8
# Every license in the dependency graph today; a new one needs a look.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "WTFPL",
    "Zlib",
]

[licenses.private]
# The workspace's own crates are not published.
ignore = true

[bans]
# Duplicates are reported, not refused: those left come from dependencies
# (phf via scraper, ratatui's hashbrown, async-trait's syn).
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# djs, the codemode VM, pinned by revision.
allow-git = ["https://github.com/earendil-works/djs"]
